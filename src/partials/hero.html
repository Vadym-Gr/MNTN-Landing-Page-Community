<section class="hero" aria-labelledby="hero-title">
  <div class="hero-landscape" aria-hidden="true">
    <div class="hero-layer hero-sky"></div>
    <div class="hero-shade"></div>
    <div class="hero-layer hero-mountains"></div>
    <div class="hero-layer hero-foreground"></div>
    <div class="hero-fade"></div>
  </div>
  <div class="hero-content">
    <p class="hero-tagline">A Hiking guide</p>
    <h1 class="hero-title" id="hero-title">
      Be prepared for the Mountains and beyond!
    </h1>
    <a class="hero-scroll" href="#content">
      <span>scroll down</span>
      <img src="./img/hero/arrow-down.svg" width="16" height="24" alt="" />
    </a>
  </div>
  <aside class="hero-social" aria-label="Social media">
    <p class="hero-social-label">Follow us</p>
    <ul class="hero-social-list">
      <li>
        <a
          class="hero-social-link"
          role="link"
          aria-disabled="true"
          aria-label="Instagram — coming soon"
          ><img src="./img/hero/instagram.svg" width="24" height="24" alt=""
        /></a>
      </li>
      <li>
        <a
          class="hero-social-link"
          role="link"
          aria-disabled="true"
          aria-label="Twitter — coming soon"
          ><img src="./img/hero/twitter.svg" width="24" height="24" alt=""
        /></a>
      </li>
    </ul>
  </aside>
</section>
