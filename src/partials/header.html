<header class="header" id="start">
  <div class="header-container">
    <a class="header-logo" href="./index.html" aria-label="MNTN home">MNTN</a>
    <nav class="header-nav" aria-label="Main navigation">
      <ul class="header-links">
        <li><a class="header-link" href="#equipment">Equipment</a></li>
        <li><a class="header-link" href="#about">About us</a></li>
        <li><a class="header-link" href="#blog">Blog</a></li>
      </ul>
    </nav>
    <button
      class="header-account"
      type="button"
      disabled
      aria-label="Account — coming soon"
    >
      <img src="./img/account.svg" width="24" height="24" alt="" /><span
        >Account</span
      >
    </button>
    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-menu"
      aria-label="Open navigation menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
  <dialog class="mobile-menu" id="mobile-menu" aria-labelledby="menu-title">
    <div class="mobile-menu-top">
      <span class="header-logo" id="menu-title">MNTN</span>
      <button
        class="menu-close"
        type="button"

    <nav aria-label="Mobile navigation">
      <ul class="mobile-menu-links">
        <li><a class="header-link" href="#equipment">Equipment</a></li>
        <li><a class="header-link" href="#about">About us</a></li>
        <li><a class="header-link" href="#blog">Blog</a></li>
      </ul>
    </nav>
    <button
      class="header-account mobile-menu-account"
      type="button"
      disabled
      aria-label="Account — coming soon"
    >
      <img src="./img/account.svg" width="24" height="24" alt="" /><span
        >Account</span
      >
    </button>
